<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f4f8"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>Школьный дневник</title></head><body>
<header class="top"><div><small>МОЯ ШКОЛА</small><h1 id="pageTitle">Расписание</h1></div><span class="online"><i></i> онлайн</span></header>
<main><section id="schedule" class="screen active"><div class="week-heading"><span>Моя неделя</span><small>Расписание повторяется каждую неделю</small></div><div class="dates" id="dateStrip"></div><div id="selectedDay"></div><div id="lessonCards"></div></section>
<section id="homework" class="screen"><div class="week-heading"><span>Домашние задания</span><small>Задания по выбранной дате</small></div><div class="dates" id="hwDates"></div><div id="homeworkCards"></div></section>
<section id="settings" class="screen"><h2>Настройки</h2><div class="setting"><div><b>Тема оформления</b><small>Системная, светлая или тёмная</small></div><select id="themeSelect"><option value="system">Как на устройстве</option><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div><button id="refresh">↻ Обновить данные</button><p id="status" class="muted">Подключение…</p></section></main>
<nav><button class="active" data-screen="schedule"><span>▦</span>Расписание</button><button data-screen="homework"><span>▤</span>Задания</button><button data-screen="settings"><span>⚙</span>Настройки</button></nav>
<script type="module" src="./app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
