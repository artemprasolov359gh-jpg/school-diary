<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><title>Админ-панель</title></head><body>
<header><div><small>SCHOOL DIARY · CONTROL</small><h1>Админ-панель</h1></div><button id="theme" class="secondary">◐</button></header><main>
<section id="login" class="panel"><h2>Вход администратора</h2><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button class="primary">Войти</button><p id="loginError" class="muted"></p></form></section>
<section id="workspace" hidden><div class="bar"><h2>Управление дневником</h2><button id="logout" class="secondary">Выйти</button></div>
<section class="panel"><div class="bar"><h3 id="formTitle">Добавить урок</h3><button id="clear" class="secondary" type="button">Очистить</button></div>
<form id="lessonForm" class="form"><input id="editId" type="hidden"><label>Дата<input id="date" type="date" required></label><label>Предмет<input id="subject" placeholder="Математика" maxlength="70" required></label><label>Начало<input id="start" type="time" required></label><label>Окончание<input id="end" type="time" required></label><label class="wide">Домашнее задание<textarea id="homework" rows="3" placeholder="Страница, номер упражнения…"></textarea></label><button class="primary wide">Сохранить урок</button></form><p id="message" class="muted"></p></section>
<div class="bar"><h3>Все записи</h3><span id="total" class="muted"></span></div><div id="records"></div></section></main>
<script type="module" src="./app.js"></script><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
